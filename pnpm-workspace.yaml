packages:
  - "packages/*"
  # The site of GitHub Pages is a private package of the workspace.
  - "site"

onlyBuiltDependencies:
  - "@mark1russell7/cue"
  - esbuild

# Our own packages: the release train updates them, so the release age check of pnpm does not apply to them.
minimumReleaseAgeExclude:
  - "@mark1russell7/*"
  - "@procedures/*"

# An install fails when a new version has less trust evidence than an earlier version of the same package: for
# example, a version with no provenance after versions from a trusted publisher. Such a version can be a stolen token.
trustPolicy: no-downgrade
# The check examines the versions of the last 7 days. A stolen-token version is new, and the registry removes it in
# hours. Older versions can have less evidence for other reasons: for example undici-types 6.21.0 under @types/node.
trustPolicyIgnoreAfter: 10080

# The release train updates our own scopes, and it checks the provenance of each version. pnpm cannot use them: it
# ranks the first versions, which were staged by hand, above the versions from release.yml (pnpm/pnpm#16689).
trustPolicyExclude:
  - "@mark1russell7/*"
  - "@procedures/*"

# The security fixes of transitive dependencies (the Dependabot and osv-scanner alerts of 2026-11-08).
# Each key names only the vulnerable versions, so the newer major lines stay as they are.
overrides:
  "brace-expansion@<1.1.20": "^1.1.21"
  "js-yaml@>=3 <3.15.2": "^3.15.2"
  "postcss@<8.5.18": "^8.5.32"
  "shell-quote@<1.9.0": "^1.12.0"
  "ws@>=6 <6.2.4": "^6.2.6"
  "ws@>=7 <7.5.11": "^7.5.13"
  # The Expo 54 tools use minimatch 9 and 10 and glob 13. The fixes are only in new major lines: minimatch 11.0.1
  # (GHSA-g3hv-75wg-m249) and glob 14.0.2 (GHSA-3g3m-2fjr-6pw4). The job ci of ci.yml starts the Expo tools as their gate.
  "minimatch@>=7 <11.0.1": "^11.0.1"
  "glob@>=9 <14.0.2": "^14.0.2"
  # @expo/metro 54.2.0, the last version for Expo SDK 54, pins metro 0.83.3. That metro uses image-size 1, which has
  # no fixed version. Metro 0.83.8 does not use image-size, and react-native 0.81.5 uses 0.83.8 already.
  "metro@0.83.3": "0.83.8"
  "metro-babel-transformer@0.83.3": "0.83.8"
  "metro-cache@0.83.3": "0.83.8"
  "metro-cache-key@0.83.3": "0.83.8"
  "metro-config@0.83.3": "0.83.8"
  "metro-core@0.83.3": "0.83.8"
  "metro-file-map@0.83.3": "0.83.8"
  "metro-minify-terser@0.83.3": "0.83.8"
  "metro-resolver@0.83.3": "0.83.8"
  "metro-runtime@0.83.3": "0.83.8"
  "metro-source-map@0.83.3": "0.83.8"
  "metro-symbolicate@0.83.3": "0.83.8"
  "metro-transform-plugins@0.83.3": "0.83.8"
  "metro-transform-worker@0.83.3": "0.83.8"
